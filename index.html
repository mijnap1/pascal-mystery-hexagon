<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pascal's Mysterious Hexagon Theorem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4fb;
      --bg-soft: #eef0fa;
      --ink: #131b31;
      --muted: #6f788d;
      --border: rgba(19, 27, 49, 0.12);
      --panel: rgba(255, 255, 255, 0.7);
      --curve: #b6a48f;
      --hex: #1f4c48;
      --point: #c96544;
      --guide: rgba(112, 128, 170, 0.26);
      --pascal: #c96544;
      --shadow: 0 22px 70px rgba(42, 54, 96, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.92), transparent 26%),
        radial-gradient(circle at 82% 18%, rgba(116, 146, 255, 0.08), transparent 24%),
        radial-gradient(circle at 72% 78%, rgba(201, 101, 68, 0.08), transparent 22%),
        linear-gradient(180deg, var(--bg), var(--bg-soft));
      color: var(--ink);
      font-family: "Lexend", "Avenir Next", "SF Pro Display", "Helvetica Neue", sans-serif;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      position: absolute;
      top: 26px;
      right: 26px;
      z-index: 30;
      display: flex;
      gap: 12px;
    }

    .pill {
      border: 1px solid rgba(19, 27, 49, 0.14);
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      border-radius: 999px;
      min-width: 64px;
      height: 64px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      box-shadow: 0 10px 26px rgba(42, 54, 96, 0.08);
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(42, 54, 96, 0.1);
    }

    .pill.active {
      border-color: rgba(19, 27, 49, 0.48);
      background: rgba(255, 255, 255, 0.98);
    }

    .pill.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
    }

    .pill-lang {
      gap: 8px;
      min-width: 76px;
      padding: 0 18px;
    }

    .pill-icon {
      width: 17px;
      height: 17px;
      display: inline-block;
      color: currentColor;
      flex: 0 0 auto;
    }

    .hero {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 40px;
      transition: opacity 500ms ease, transform 500ms ease;
    }

    .hero.hidden {
      opacity: 0;
      transform: translateY(-24px);
      pointer-events: none;
    }

    .hero-inner {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
      gap: 36px;
      align-items: center;
      text-align: left;
    }

    .hero-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: clamp(0.78rem, 1vw, 0.92rem);
      font-weight: 600;
      letter-spacing: 0;
    }

    .title {
      margin: 0;
      font-size: clamp(2.8rem, 6.8vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: -0.065em;
      font-weight: 800;
      max-width: 9ch;
    }

    .subtitle {
      margin: 22px 0 0;
      max-width: 31ch;
      color: var(--muted);
      font-size: clamp(0.98rem, 1.45vw, 1.32rem);
      line-height: 1.58;
      letter-spacing: -0.035em;
    }

    .hero-actions {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .action {
      height: 58px;
      padding: 0 22px;
      border-radius: 18px;
      border: 1px solid rgba(19, 27, 49, 0.12);
      background: rgba(255, 255, 255, 0.86);
      color: var(--muted);
      font: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      box-shadow: 0 10px 26px rgba(42, 54, 96, 0.08);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .action.primary {
      color: var(--ink);
      border: 2px solid rgba(19, 27, 49, 0.46);
      background: rgba(255, 255, 255, 0.92);
    }

    .action:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(42, 54, 96, 0.1);
    }

    .action:active,
    .pill:active,
    .nav:active {
      transform: translateY(0) scale(0.985);
    }

    .action-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      color: currentColor;
      flex: 0 0 auto;
    }

    .hero-figure {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-left: -28px;
    }

    .hero-image {
      width: min(118%, 460px);
      max-height: 70vh;
      object-fit: contain;
      filter: drop-shadow(0 20px 42px rgba(42, 54, 96, 0.14));
      user-select: none;
      pointer-events: none;
      transform: translateX(-18px);
    }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 26px 26px 248px;
    }

    .diagram-shell {
      width: min(94vw, 94vh);
      height: min(94vw, 94vh);
      transition: transform 900ms cubic-bezier(0.22, 1, 0.36, 1), opacity 400ms ease;
      transform-origin: center center;
      opacity: 0;
    }

    .diagram-shell.visible {
      opacity: 1;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .caption {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 25;
      width: min(900px, calc(100vw - 48px));
      text-align: center;
      pointer-events: none;
      transition: opacity 280ms ease, transform 280ms ease;
    }

    .caption.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(16px);
    }

    .caption-box {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 320ms ease, transform 320ms ease;
    }

    .caption-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .caption-step {
      display: block;
      margin-bottom: 10px;
      color: rgba(19, 27, 49, 0.56);
      font-size: clamp(0.72rem, 0.9vw, 0.86rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .caption-title {
      display: block;
      font-size: clamp(1.04rem, 1.4vw, 1.42rem);
      line-height: 1.24;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .caption-text {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(0.92rem, 1.1vw, 1.08rem);
      line-height: 1.52;
      letter-spacing: -0.03em;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 170px;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      gap: 12px;
      align-items: center;
      transition: opacity 280ms ease, transform 280ms ease;
    }

    .controls.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(16px);
      pointer-events: none;
    }

    .side-legend {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      width: min(280px, calc(100vw - 48px));
      display: grid;
      gap: 10px;
      transition: opacity 280ms ease, transform 280ms ease;
    }

    .side-legend.hidden {
      opacity: 0;
      transform: translateY(calc(-50% + 16px));
      pointer-events: none;
    }

    .side-legend-title {
      color: rgba(19, 27, 49, 0.5);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .side-legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .side-legend-item.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .nav {
      min-width: 64px;
      height: 64px;
      border: 1px solid rgba(19, 27, 49, 0.12);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 10px 26px rgba(42, 54, 96, 0.08);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    .nav:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(42, 54, 96, 0.1);
    }

    .nav:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .outro {
      position: absolute;
      inset: 0;
      z-index: 24;
      display: grid;
      place-items: center;
      padding: 40px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: opacity 420ms ease, transform 420ms ease;
    }

    .outro.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .outro-inner {
      width: min(1140px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(280px, 360px);
      gap: 48px;
      align-items: start;
    }

    .outro-copy {
      min-width: 0;
    }

    .outro-title {
      margin: 0;
      max-width: 10ch;
      font-size: clamp(2.6rem, 6.1vw, 5rem);
      line-height: 0.94;
      letter-spacing: -0.06em;
      font-weight: 800;
    }

    .outro-subtitle {
      margin: 20px 0 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: clamp(0.96rem, 1.35vw, 1.24rem);
      line-height: 1.58;
      letter-spacing: -0.03em;
    }

    .sources {
      margin: 26px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 12px;
      max-width: 680px;
    }

    .sources a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      transition: color 180ms ease, transform 180ms ease;
    }

    .sources a:hover {
      color: var(--ink);
      transform: translateX(2px);
    }

    .source-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(19, 27, 49, 0.24);
      flex: 0 0 auto;
    }

    .outro-actions {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .legend-line {
      width: 34px;
      height: 0;
      border-top-width: 3px;
      border-top-style: solid;
      flex: 0 0 auto;
      border-radius: 999px;
    }

    .legend-line.curve {
      border-top-color: var(--curve);
    }

    .legend-line.hex {
      border-top-color: var(--hex);
    }

    .legend-line.guide {
      border-top-color: rgba(112, 128, 170, 0.72);
    }

    .legend-line.pascal {
      border-top-color: var(--pascal);
    }

    .outro-side {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding-top: 46px;
    }

    @media (max-width: 780px) {
      .topbar {
        top: 18px;
        right: 18px;
      }

      .pill {
        min-width: 56px;
        height: 56px;
        padding: 0 14px;
      }

      .pill-lang {
        min-width: 68px;
      }

      .hero {
        padding: 28px 22px 120px;
      }

      .hero-inner {
        grid-template-columns: 1fr;
        text-align: left;
      }

      .hero-figure {
        margin-left: 0;
      }

      .hero-image {
        width: min(100%, 420px);
      }

      .title {
        max-width: none;
      }

      .hero-actions {
        gap: 10px;
      }

      .action {
        height: 54px;
        padding: 0 18px;
        border-radius: 18px;
      }

      .diagram-shell {
        width: 100vw;
        height: 100vw;
        max-height: 68vh;
      }

      .controls {
        bottom: 154px;
      }

      .side-legend {
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: min(220px, calc(100vw - 24px));
      }

      .stage {
        padding: 18px 18px 228px;
      }

      .outro {
        padding: 28px 22px;
      }

      .outro-inner {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .outro-side {
        padding-top: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <button class="pill hidden" id="home-button" type="button" aria-label="Go to home">
        <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 4.2 4.5 10v9a1 1 0 0 0 1 1H10v-5h4v5h4.5a1 1 0 0 0 1-1v-9z"/>
        </svg>
      </button>
      <button class="pill pill-lang active" id="lang-en" type="button" aria-label="Switch to English">
        <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m6.93 9h-3.08a15.7 15.7 0 0 0-1.38-5A8.04 8.04 0 0 1 18.93 11M12 4.07c.96 1.14 1.8 3.08 2.17 5.43H9.83C10.2 7.15 11.04 5.21 12 4.07M4.07 13h3.08a15.7 15.7 0 0 0 1.38 5A8.04 8.04 0 0 1 4.07 13m3.08-2H4.07a8.04 8.04 0 0 1 4.46-5a15.7 15.7 0 0 0-1.38 5M12 19.93c-.96-1.14-1.8-3.08-2.17-5.43h4.34c-.37 2.35-1.21 4.29-2.17 5.43M14.5 13h-5a13.95 13.95 0 0 1 0-2h5a13.95 13.95 0 0 1 0 2m-.03 5a15.7 15.7 0 0 0 1.38-5h3.08A8.04 8.04 0 0 1 14.47 18"/>
        </svg>
        <span>EN</span>
      </button>
      <button class="pill pill-lang" id="lang-ko" type="button" aria-label="한국어로 전환">
        <span class="pill-icon" style="display:grid;place-items:center;font-weight:700;font-size:0.98rem;line-height:1;">가</span>
        <span>KR</span>
      </button>
    </div>

    <section class="hero" id="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="heroEyebrow">Interactive Geometry Story</p>
          <h1 class="title" data-i18n="heroTitle">Pascal's Mysterious Hexagon Theorem</h1>
          <p class="subtitle" data-i18n="heroSubtitle">A slow, step-by-step visual proof. Follow the points, build the hexagon, and watch the hidden line appear.</p>
          <div class="hero-actions">
            <button class="action primary" id="start-button" type="button">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M8 6.5v11l9-5.5z"/>
              </svg>
              <span data-i18n="start">Start Tutorial</span>
            </button>
            <button class="action" id="hero-language" type="button">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m6.93 9h-3.08a15.7 15.7 0 0 0-1.38-5A8.04 8.04 0 0 1 18.93 11M12 4.07c.96 1.14 1.8 3.08 2.17 5.43H9.83C10.2 7.15 11.04 5.21 12 4.07M4.07 13h3.08a15.7 15.7 0 0 0 1.38 5A8.04 8.04 0 0 1 4.07 13m3.08-2H4.07a8.04 8.04 0 0 1 4.46-5a15.7 15.7 0 0 0-1.38 5M12 19.93c-.96-1.14-1.8-3.08-2.17-5.43h4.34c-.37 2.35-1.21 4.29-2.17 5.43M14.5 13h-5a13.95 13.95 0 0 1 0-2h5a13.95 13.95 0 0 1 0 2m-.03 5a15.7 15.7 0 0 0 1.38-5h3.08A8.04 8.04 0 0 1 14.47 18"/>
              </svg>
              <span data-i18n="switchLabel">Switch Language</span>
            </button>
          </div>
        </div>
        <div class="hero-figure">
          <img class="hero-image" src="./pascal.png" alt="Portrait of Pascal">
        </div>
      </div>
    </section>

    <section class="stage">
      <div class="diagram-shell" id="diagram-shell">
        <svg id="diagram" viewBox="0 0 1000 1000" aria-label="Pascal's Mysterious Hexagon Theorem diagram"></svg>
      </div>
    </section>

    <section class="controls hidden" id="controls">
      <button class="nav" id="prev-button" type="button" aria-label="Previous step">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M14.7 6.3a1 1 0 0 1 0 1.4L10.41 12l4.29 4.3a1 1 0 0 1-1.41 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.41 0"/>
        </svg>
      </button>
      <button class="nav" id="next-button" type="button" aria-label="Next step">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M9.3 17.7a1 1 0 0 1 0-1.4L13.59 12L9.3 7.7a1 1 0 0 1 1.41-1.4l5 5a1 1 0 0 1 0 1.4l-5 5a1 1 0 0 1-1.41 0"/>
        </svg>
      </button>
    </section>

    <aside class="side-legend hidden" id="side-legend" aria-live="polite">
      <div class="side-legend-title" id="legend-title"></div>
      <div class="side-legend-item" id="legend-item-curve"><span class="legend-line curve"></span><span id="legend-curve"></span></div>
      <div class="side-legend-item" id="legend-item-hex"><span class="legend-line hex"></span><span id="legend-hex"></span></div>
      <div class="side-legend-item" id="legend-item-guide"><span class="legend-line guide"></span><span id="legend-guide"></span></div>
      <div class="side-legend-item" id="legend-item-pascal"><span class="legend-line pascal"></span><span id="legend-pascal"></span></div>
    </aside>

    <section class="caption hidden" aria-live="polite">
      <div class="caption-box" id="caption-box">
        <span class="caption-step" id="caption-step"></span>
        <span class="caption-title" id="caption-title"></span>
        <span class="caption-text" id="caption-text"></span>
      </div>
    </section>

    <section class="outro" id="outro">
      <div class="outro-inner">
        <div class="outro-copy">
          <p class="eyebrow" id="outro-eyebrow"></p>
          <h2 class="outro-title" id="outro-title"></h2>
          <p class="outro-subtitle" id="outro-subtitle"></p>
          <ul class="sources" id="sources-list"></ul>
          <div class="outro-actions">
            <button class="action primary" id="restart-button" type="button">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 5a7 7 0 1 1-6.32 10H3.5a.5.5 0 0 1-.4-.8l2.82-3.76a.5.5 0 0 1 .8 0l2.82 3.76a.5.5 0 0 1-.4.8H7.82A5 5 0 1 0 12 7a4.96 4.96 0 0 0-2.73.81a1 1 0 1 1-1.09-1.68A6.96 6.96 0 0 1 12 5"/>
              </svg>
              <span id="restart-label"></span>
            </button>
            <button class="action" id="outro-home-button" type="button">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 4.2 4.5 10v9a1 1 0 0 0 1 1H10v-5h4v5h4.5a1 1 0 0 0 1-1v-9z"/>
              </svg>
              <span id="outro-home-label"></span>
            </button>
          </div>
        </div>
        <div class="outro-side"></div>
      </div>
    </section>
  </main>

  <script>
    const NS = "http://www.w3.org/2000/svg";

    const copy = {
      en: {
        heroEyebrow: "Interactive Geometry Story",
        heroTitle: "Pascal's Mysterious Hexagon Theorem",
        heroSubtitle: "A slow, step-by-step visual proof. Follow the points, build the hexagon, and watch the hidden line appear.",
        start: "Start Tutorial",
        switchLabel: "한국어 보기",
        outroEyebrow: "Outro",
        outroTitle: "Pascal's line revealed.",
        outroSubtitle: "The construction closes on a single straight line. Here are a few references you could attach later with real sources.",
        restart: "Replay Tutorial",
        home: "Back Home",
        legendTitle: "What is appearing",
        legendCurve: "Conic",
        legendHex: "Inscribed hexagon",
        legendGuide: "Extended opposite sides",
        legendPascal: "Pascal line",
        sources: [
          { label: "Projective Geometry Notes", url: "https://example.com/projective-geometry" },
          { label: "Pascal Hexagon Article", url: "https://example.com/pascal-hexagon" },
          { label: "Conics and Incidence", url: "https://example.com/conics-incidence" }
        ],
        steps: [
          {
            step: "Step 1",
            title: "First, place point A and B",
            text: "Two points appear on the curve. Nothing special yet, just the beginning of the construction."
          },
          {
            step: "Step 2",

          },

          },
          {

            text: "Next extend BC and EF. A second outer intersection shows up."
          },
          {
            step: "Step 7",

            text: "Now extend CD and FA. The third intersection completes the pattern."
          },
          {
            step: "Step 8",
            title: "Look closely at the three intersections",

          }
        ]
      },
      ko: {
        heroEyebrow: "인터랙티브 기하 스토리",
        heroTitle: "Pascal's Mysterious Hexagon Theorem",
        heroSubtitle: "천천히 따라가는 시각적 증명입니다. 점을 찍고, 육각형을 만들고, 마지막 숨은 직선이 드러나는 순간까지 보세요.",
        start: "튜토리얼 시작",
        switchLabel: "View in English",
        outroEyebrow: "Outro",
        outroTitle: "Pascal line 이 드러납니다.",
        outroSubtitle: "구성이 마지막에 하나의 직선으로 닫힙니다. 지금은 깔끔한 레이아웃 확인용으로 임시 링크를 넣어두었습니다.",
        restart: "튜토리얼 다시 보기",
        home: "홈으로 돌아가기",
        legendTitle: "지금 나타나는 것",
        legendCurve: "원뿔곡선",
        legendHex: "내접 육각형",
        legendGuide: "연장된 마주 보는 변",
        legendPascal: "Pascal line",
        sources: [
          { label: "프로젝티브 기하 노트", url: "https://example.com/projective-geometry" },
          { label: "파스칼 육각형 아티클", url: "https://example.com/pascal-hexagon" },
          { label: "원뿔곡선과 정렬", url: "https://example.com/conics-incidence" }
        ],
        steps: [
          {
            step: "Step 1",

          },
          {
            step: "Step 2",
            title: "이제 C와 D를 이어서 잡습니다",
            text: "같은 곡선 위에서 점을 더 고르면서 육각형의 리듬이 만들어집니다."
          },
          {
            step: "Step 3",
            title: "마지막으로 E와 F를 놓습니다",
            text: "이제 A, B, C, D, E, F 여섯 점이 모두 한 원뿔곡선 위에 있습니다."
          },
          {
            step: "Step 4",
            title: "점들을 순서대로 연결합니다",
            text: "여섯 점을 차례대로 이으면 파스칼의 육각형이 완성됩니다."
          },
          {
            step: "Step 5",
            title: "첫 번째 마주 보는 변을 연장합니다",
            text: "AB와 DE를 길게 뻗어 보면 바깥에서 첫 번째 교점이 생깁니다."
          },
          {
            step: "Step 6",
            title: "두 번째 마주 보는 변도 연장합니다",
            text: "이번에는 BC와 EF를 연장해서 두 번째 교점을 얻습니다."
          },
          {
            step: "Step 7",
            title: "마지막 쌍도 연장합니다",
            text: "CD와 FA를 연장하면 세 번째 교점이 생기고 패턴이 완성됩니다."
          },
          {
            step: "Step 8",
            title: "세 교점을 한 번에 보세요",
            text: "세 점은 흩어지지 않고 정확히 하나의 직선 위에 놓입니다."
          }
        ]
      }
    };

    const cameraStates = [
      { scale: 0.92, x: 0, y: 0, visible: false },
      { scale: 1.12, x: -12, y: -118, visible: true },
      { scale: 1.14, x: -10, y: -102, visible: true },
      { scale: 1.08, x: -4, y: -88, visible: true },
      { scale: 1.02, x: -6, y: -74, visible: true },
      { scale: 1.28, x: -118, y: -92, visible: true },
      { scale: 1.22, x: -54, y: -112, visible: true },
      { scale: 1.26, x: 36, y: -132, visible: true },
      { scale: 1.08, x: 0, y: -82, visible: true },
      { scale: 0.9, x: 210, y: -26, visible: true }
    ];

    const svg = document.getElementById("diagram");
    const hero = document.getElementById("hero");
    const diagramShell = document.getElementById("diagram-shell");
    const captionBox = document.getElementById("caption-box");
    const captionStep = document.getElementById("caption-step");
    const captionTitle = document.getElementById("caption-title");
    const captionText = document.getElementById("caption-text");
    const prevButton = document.getElementById("prev-button");
    const nextButton = document.getElementById("next-button");
    const startButton = document.getElementById("start-button");
    const heroLanguage = document.getElementById("hero-language");
    const langEn = document.getElementById("lang-en");
    const langKo = document.getElementById("lang-ko");
    const homeButton = document.getElementById("home-button");
    const controls = document.getElementById("controls");
    const sideLegend = document.getElementById("side-legend");
    const legendTitle = document.getElementById("legend-title");
    const legendCurve = document.getElementById("legend-curve");
    const legendHex = document.getElementById("legend-hex");
    const legendGuide = document.getElementById("legend-guide");
    const legendPascal = document.getElementById("legend-pascal");
    const legendItemCurve = document.getElementById("legend-item-curve");
    const legendItemHex = document.getElementById("legend-item-hex");
    const legendItemGuide = document.getElementById("legend-item-guide");
    const legendItemPascal = document.getElementById("legend-item-pascal");
    const outro = document.getElementById("outro");
    const outroEyebrow = document.getElementById("outro-eyebrow");
    const outroTitle = document.getElementById("outro-title");
    const outroSubtitle = document.getElementById("outro-subtitle");
    const sourcesList = document.getElementById("sources-list");
    const restartButton = document.getElementById("restart-button");
    const restartLabel = document.getElementById("restart-label");
    const outroHomeButton = document.getElementById("outro-home-button");
    const outroHomeLabel = document.getElementById("outro-home-label");

    const center = { x: 500, y: 500 };
    const ellipse = { rx: 292, ry: 208 };
    const angles = [236, 304, 348, 0, 20, 40];
    const labels = ["A", "B", "C", "D", "E", "F"];
    const points = angles.map((angle) => pointOnEllipse(angle));
    const oppositePairs = [
      [0, 1, 3, 4],
      [1, 2, 4, 5],
      [2, 3, 5, 0]
    ];
    const intersections = oppositePairs.map(([a1, a2, b1, b2]) =>
      lineIntersection(points[a1], points[a2], points[b1], points[b2])
    );

    const state = {
      language: "en",
      step: 0,
      started: false
    };

    const nodes = {
      curve: null,
      polygon: null,
      guidePairs: [],
      pointDots: [],
      pointLabels: [],
      intersectionGlows: [],
      intersectionPoints: [],
      pascalLine: null
    };

    buildScene();
    applyLanguage();
    render();

    startButton.addEventListener("click", () => {
      state.started = true;
      state.step = 0;
      render();
    });

    heroLanguage.addEventListener("click", () => {
      setLanguage(state.language === "en" ? "ko" : "en");
    });

    langEn.addEventListener("click", () => setLanguage("en"));
    langKo.addEventListener("click", () => setLanguage("ko"));
    homeButton.addEventListener("click", goHome);
    restartButton.addEventListener("click", () => {
      state.started = true;
      state.step = 0;
      render();
    });
    outroHomeButton.addEventListener("click", goHome);

    prevButton.addEventListener("click", previousStep);
    nextButton.addEventListener("click", nextStep);

    window.addEventListener("keydown", (event) => {
      if (event.key === " " || event.key === "ArrowRight") {
        event.preventDefault();
        if (!state.started) {
          state.started = true;
          state.step = 0;
          render();
          return;
        }
        nextStep();
      }

      if (event.key === "ArrowLeft") {
        event.preventDefault();
        previousStep();
      }
    });

    function setLanguage(language) {
      state.language = language;
      applyLanguage();
      render();
    }

    function nextStep() {
      if (!state.started) return;
      state.step = Math.min(copy[state.language].steps.length, state.step + 1);
      render();
    }

    function previousStep() {
      if (!state.started) return;
      if (state.step === 0) {
        goHome();
        return;
      }
      state.step -= 1;
      render();
    }

    function goHome() {
      state.started = false;
      state.step = 0;
      render();
    }

    function applyLanguage() {
      document.documentElement.lang = state.language === "ko" ? "ko" : "en";
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        node.textContent = copy[state.language][node.dataset.i18n];
      });
      outroEyebrow.textContent = copy[state.language].outroEyebrow;
      outroTitle.textContent = copy[state.language].outroTitle;
      outroSubtitle.textContent = copy[state.language].outroSubtitle;
      restartLabel.textContent = copy[state.language].restart;
      outroHomeLabel.textContent = copy[state.language].home;
      legendTitle.textContent = copy[state.language].legendTitle;
      legendCurve.textContent = copy[state.language].legendCurve;
      legendHex.textContent = copy[state.language].legendHex;
      legendGuide.textContent = copy[state.language].legendGuide;
      legendPascal.textContent = copy[state.language].legendPascal;
      sourcesList.innerHTML = "";
      copy[state.language].sources.forEach((source) => {
        const item = document.createElement("li");
        item.innerHTML = `<a href="${source.url}" target="_blank" rel="noreferrer"><span class="source-dot"></span><span>${source.label}</span></a>`;
        sourcesList.appendChild(item);
      });
      langEn.classList.toggle("active", state.language === "en");
      langKo.classList.toggle("active", state.language === "ko");
    }

    function render() {
      const tutorialCount = copy[state.language].steps.length;
      const isOutro = state.started && state.step === tutorialCount;
      const inTutorial = state.started && !isOutro;

      hero.classList.toggle("hidden", state.started);
      outro.classList.toggle("visible", isOutro);
      controls.classList.toggle("hidden", !inTutorial);
      sideLegend.classList.toggle("hidden", !inTutorial);
      captionBox.classList.toggle("visible", inTutorial);
      captionBox.parentElement.classList.toggle("hidden", !inTutorial);
      diagramShell.classList.toggle("visible", state.started);
      homeButton.classList.toggle("hidden", !state.started);

      if (inTutorial) {
        const stepCopy = copy[state.language].steps[state.step];
        captionStep.textContent = stepCopy.step;
        captionTitle.textContent = stepCopy.title;
        captionText.textContent = stepCopy.text;
      }

      prevButton.disabled = !inTutorial;
      nextButton.disabled = !inTutorial || state.step === tutorialCount;

      updateCamera();
      updateGeometry();
      updateLegend(inTutorial ? state.step : -1);
    }

    function updateCamera() {
      const cameraIndex = state.started ? Math.min(state.step + 1, cameraStates.length - 1) : 0;
      const camera = cameraStates[cameraIndex];
      diagramShell.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
      diagramShell.style.opacity = camera.visible ? "1" : "0";
    }

    function updateGeometry() {
      const revealLevel = state.started ? Math.min(state.step + 1, 8) : 0;

      setStrokeProgress(nodes.curve, revealLevel >= 1 ? 1 : 0);

      nodes.pointDots.forEach((node, index) => {
        node.style.opacity = revealLevel >= pointStep(index) ? "1" : "0";
        node.style.transform = revealLevel >= pointStep(index) ? "scale(1)" : "scale(0.4)";
      });

      nodes.pointLabels.forEach((node, index) => {
        node.style.opacity = revealLevel >= pointStep(index) ? "1" : "0";
        node.style.transform = revealLevel >= pointStep(index) ? "translateY(0)" : "translateY(10px)";
      });

      setStrokeProgress(nodes.polygon, revealLevel >= 4 ? 1 : 0);

      nodes.guidePairs.forEach((pair, index) => {
        const visible = revealLevel >= 5 + index;
        pair.forEach((line) => setStrokeProgress(line, visible ? 1 : 0));
      });

      nodes.intersectionGlows.forEach((node, index) => {
        node.style.opacity = revealLevel >= 5 + index ? "1" : "0";
        node.style.transform = revealLevel >= 5 + index ? "scale(1)" : "scale(0.55)";
      });

      nodes.intersectionPoints.forEach((node, index) => {
        node.style.opacity = revealLevel >= 5 + index ? "1" : "0";
        node.style.transform = revealLevel >= 5 + index ? "scale(1)" : "scale(0.4)";
      });

      setStrokeProgress(nodes.pascalLine, revealLevel >= 8 ? 1 : 0);
    }

    function updateLegend(step) {
      legendItemCurve.classList.toggle("visible", step >= 0);
      legendItemHex.classList.toggle("visible", step >= 3);
      legendItemGuide.classList.toggle("visible", step >= 4);
      legendItemPascal.classList.toggle("visible", step >= 7);
    }

    function pointStep(index) {
      if (index < 2) return 1;
      if (index < 4) return 2;
      return 3;
    }

    function buildScene() {
      svg.innerHTML = "";

      add("defs", {}, [
        createFilter(),
        createGradient("glowGradient", [
          ["0%", "stop-color:#c96544;stop-opacity:0.17"],
          ["100%", "stop-color:#c96544;stop-opacity:0"]
        ])
      ]);

      nodes.curve = add("ellipse", {
        cx: center.x,
        cy: center.y,
        rx: ellipse.rx,
        ry: ellipse.ry,
        fill: "none",
        stroke: "var(--curve)",
        "stroke-width": 2.4,
        "stroke-linecap": "round"
      });

      nodes.polygon = add("polygon", {
        points: points.map(toPair).join(" "),
        fill: "none",
        stroke: "var(--hex)",
        "stroke-width": 3.5,
        "stroke-linejoin": "round"
      });

      points.forEach((point, index) => {
        const dot = add("circle", {
          cx: point.x,
          cy: point.y,
          r: 8.8,
          fill: "var(--point)",
          stroke: "#fffaf3",
          "stroke-width": 2
        });
        dot.style.opacity = "0";
        dot.style.transformOrigin = "center";
        dot.style.transition = "opacity 420ms ease, transform 520ms cubic-bezier(0.22, 1, 0.36, 1)";
        nodes.pointDots.push(dot);

        const offset = labelOffset(point);
        const label = add("text", {
          x: point.x + offset.x,
          y: point.y + offset.y,
          fill: "var(--ink)",
          "font-size": 31,
          "font-family": "Iowan Old Style, Georgia, serif",
          "font-style": "italic",
          "text-anchor": "middle"
        }, labels[index]);
        label.style.opacity = "0";
        label.style.transition = "opacity 420ms ease, transform 520ms cubic-bezier(0.22, 1, 0.36, 1)";
        nodes.pointLabels.push(label);
      });

      oppositePairs.forEach(([a1, a2, b1, b2], index) => {
        const first = extendSegment(points[a1], points[a2], 180);
        const second = extendSegment(points[b1], points[b2], 180);

        const line1 = add("line", {
          x1: first.a.x,
          y1: first.a.y,
          x2: first.b.x,
          y2: first.b.y,
          stroke: "var(--guide)",
          "stroke-width": 2.15,
          "stroke-linecap": "round"
        });
        const line2 = add("line", {
          x1: second.a.x,
          y1: second.a.y,
          x2: second.b.x,
          y2: second.b.y,
          stroke: "var(--guide)",
          "stroke-width": 2.15,
          "stroke-linecap": "round"
        });

        nodes.guidePairs.push([line1, line2]);

        const glow = add("circle", {
          cx: intersections[index].x,
          cy: intersections[index].y,
          r: 38,
          fill: "url(#glowGradient)"
        });
        glow.style.opacity = "0";
        glow.style.transformOrigin = "center";
        glow.style.transition = "opacity 420ms ease, transform 520ms cubic-bezier(0.22, 1, 0.36, 1)";
        nodes.intersectionGlows.push(glow);

        const intersectionPoint = add("circle", {
          cx: intersections[index].x,
          cy: intersections[index].y,
          r: 7.8,
          fill: "var(--pascal)",
          filter: "url(#softShadow)"
        });
        intersectionPoint.style.opacity = "0";
        intersectionPoint.style.transformOrigin = "center";
        intersectionPoint.style.transition = "opacity 420ms ease, transform 520ms cubic-bezier(0.22, 1, 0.36, 1)";
        nodes.intersectionPoints.push(intersectionPoint);
      });

      const pascal = extendSegment(intersections[0], intersections[2], 76);
      nodes.pascalLine = add("line", {
        x1: pascal.a.x,
        y1: pascal.a.y,
        x2: pascal.b.x,
        y2: pascal.b.y,
        stroke: "var(--pascal)",
        "stroke-width": 4.3,
        "stroke-linecap": "round"
      });

      [nodes.curve, nodes.polygon, nodes.pascalLine].forEach(primeLine);
      nodes.guidePairs.flat().forEach(primeLine);
    }

    function primeLine(node) {
      const length = node.getTotalLength();
      node.dataset.length = String(length);
      node.style.strokeDasharray = `${length}`;
      node.style.transition = "opacity 420ms ease, stroke-dashoffset 820ms cubic-bezier(0.22, 1, 0.36, 1)";
      setStrokeProgress(node, 0);
    }

    function setStrokeProgress(node, progress) {
      const length = Number(node.dataset.length || 0);
      node.style.strokeDashoffset = `${length * (1 - progress)}`;
      node.style.opacity = progress > 0 ? "1" : "0";
    }

    function pointOnEllipse(angleDeg) {
      const angle = angleDeg * Math.PI / 180;
      return {
        x: center.x + ellipse.rx * Math.cos(angle),
        y: center.y + ellipse.ry * Math.sin(angle)
      };
    }

    function labelOffset(point) {
      const dx = point.x - center.x;
      const dy = point.y - center.y;
      const mag = Math.hypot(dx, dy);
      return {
        x: (dx / mag) * 34,
        y: (dy / mag) * 34
      };
    }

    function lineIntersection(a, b, c, d) {
      const determinant = (a.x - b.x) * (c.y - d.y) - (a.y - b.y) * (c.x - d.x);
      const det1 = a.x * b.y - a.y * b.x;
      const det2 = c.x * d.y - c.y * d.x;
      return {
        x: (det1 * (c.x - d.x) - (a.x - b.x) * det2) / determinant,
        y: (det1 * (c.y - d.y) - (a.y - b.y) * det2) / determinant
      };
    }

    function extendSegment(a, b, amount) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const length = Math.hypot(dx, dy);
      const ux = dx / length;
      const uy = dy / length;
      return {
        a: { x: a.x - ux * amount, y: a.y - uy * amount },
        b: { x: b.x + ux * amount, y: b.y + uy * amount }
      };
    }

    function createFilter() {
      const filter = document.createElementNS(NS, "filter");
      filter.setAttribute("id", "softShadow");
      filter.setAttribute("x", "-30%");
      filter.setAttribute("y", "-30%");
      filter.setAttribute("width", "160%");
      filter.setAttribute("height", "160%");

      const blur = document.createElementNS(NS, "feGaussianBlur");
      blur.setAttribute("in", "SourceAlpha");
      blur.setAttribute("stdDeviation", "6");
      filter.appendChild(blur);

      const offset = document.createElementNS(NS, "feOffset");
      offset.setAttribute("dx", "0");
      offset.setAttribute("dy", "4");
      filter.appendChild(offset);

      const color = document.createElementNS(NS, "feColorMatrix");
      color.setAttribute("type", "matrix");
      color.setAttribute("values", "0 0 0 0 0.14 0 0 0 0 0.16 0 0 0 0 0.25 0 0 0 0.16 0");
      filter.appendChild(color);

      const merge = document.createElementNS(NS, "feMerge");
      merge.appendChild(document.createElementNS(NS, "feMergeNode"));
      const source = document.createElementNS(NS, "feMergeNode");
      source.setAttribute("in", "SourceGraphic");
      merge.appendChild(source);
      filter.appendChild(merge);

      return filter;
    }

    function createGradient(id, stops) {
      const gradient = document.createElementNS(NS, "radialGradient");
      gradient.setAttribute("id", id);
      stops.forEach(([offset, style]) => {
        const stop = document.createElementNS(NS, "stop");
        stop.setAttribute("offset", offset);
        style.split(";").forEach((entry) => {
          const [key, value] = entry.split(":");
          stop.setAttribute(key, value);
        });
        gradient.appendChild(stop);
      });
      return gradient;
    }

    function add(name, attrs, content = []) {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (Array.isArray(content)) {
        content.forEach((child) => node.appendChild(child));
      } else {
        node.textContent = content;
      }
      svg.appendChild(node);
      return node;
    }

    function toPair(point) {
      return `${point.x},${point.y}`;
    }
  </script>
