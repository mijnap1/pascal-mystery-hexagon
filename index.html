<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pascal's Mysterious Hexagon Theorem</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='%23c96544'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <main class="app">
    <div class="topbar">
      <button class="pill hidden" id="home-button" type="button" aria-label="Go to home">
        <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 4.2 4.5 10v9a1 1 0 0 0 1 1H10v-5h4v5h4.5a1 1 0 0 0 1-1v-9z"/>
        </svg>
      </button>
      <button class="pill pill-lang active" id="lang-en" type="button" aria-label="Switch to English">
        <span class="pill-lang-badge" aria-hidden="true">
          <svg class="pill-icon" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m6.93 9h-3.08a15.7 15.7 0 0 0-1.38-5A8.04 8.04 0 0 1 18.93 11M12 4.07c.96 1.14 1.8 3.08 2.17 5.43H9.83C10.2 7.15 11.04 5.21 12 4.07M4.07 13h3.08a15.7 15.7 0 0 0 1.38 5A8.04 8.04 0 0 1 4.07 13m3.08-2H4.07a8.04 8.04 0 0 1 4.46-5a15.7 15.7 0 0 0-1.38 5M12 19.93c-.96-1.14-1.8-3.08-2.17-5.43h4.34c-.37 2.35-1.21 4.29-2.17 5.43M14.5 13h-5a13.95 13.95 0 0 1 0-2h5a13.95 13.95 0 0 1 0 2m-.03 5a15.7 15.7 0 0 0 1.38-5h3.08A8.04 8.04 0 0 1 14.47 18"/>
          </svg>
        </span>
        <span class="pill-lang-text">
          <span class="pill-lang-code">EN</span>
        </span>
      </button>
      <button class="pill pill-lang" id="lang-ko" type="button" aria-label="한국어로 전환">
        <span class="pill-lang-badge" aria-hidden="true">
          <span class="pill-icon" style="display:grid;place-items:center;font-weight:800;font-size:1rem;line-height:1;">가</span>
        </span>
        <span class="pill-lang-text">
          <span class="pill-lang-code">KR</span>
        </span>
      </button>
    </div>

    <section class="hero" id="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="heroEyebrow">Interactive Geometry Story</p>
          <h1 class="title" data-i18n="heroTitle">Pascal's Mysterious Hexagon Theorem</h1>
          <p class="subtitle" data-i18n="heroSubtitle">A slow, step-by-step visual proof. Follow the points, build the hexagon, and watch the hidden line appear.</p>
          <div class="hero-actions">
            <button class="action primary" id="start-button" type="button">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M8 6.5v11l9-5.5z"/>
              </svg>
              <span data-i18n="start">Start Tutorial</span>
            </button>
            <button class="action" id="hero-language" type="button">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m6.93 9h-3.08a15.7 15.7 0 0 0-1.38-5A8.04 8.04 0 0 1 18.93 11M12 4.07c.96 1.14 1.8 3.08 2.17 5.43H9.83C10.2 7.15 11.04 5.21 12 4.07M4.07 13h3.08a15.7 15.7 0 0 0 1.38 5A8.04 8.04 0 0 1 4.07 13m3.08-2H4.07a8.04 8.04 0 0 1 4.46-5a15.7 15.7 0 0 0-1.38 5M12 19.93c-.96-1.14-1.8-3.08-2.17-5.43h4.34c-.37 2.35-1.21 4.29-2.17 5.43M14.5 13h-5a13.95 13.95 0 0 1 0-2h5a13.95 13.95 0 0 1 0 2m-.03 5a15.7 15.7 0 0 0 1.38-5h3.08A8.04 8.04 0 0 1 14.47 18"/>
              </svg>
              <span data-i18n="switchLabel">Switch Language</span>
            </button>
          </div>
        </div>
        <div class="hero-figure">
          <img class="hero-image" src="./assets/images/pascal.png" alt="Portrait of Pascal">
        </div>
      </div>
    </section>

    <section class="stage">
      <div class="diagram-shell" id="diagram-shell">
        <svg id="diagram" viewBox="0 0 1000 1000" aria-label="Pascal's Mysterious Hexagon Theorem diagram"></svg>
      </div>
    </section>

    <section class="controls hidden" id="controls">
      <button class="nav" id="prev-button" type="button" aria-label="Previous step">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M14.7 6.3a1 1 0 0 1 0 1.4L10.41 12l4.29 4.3a1 1 0 0 1-1.41 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.41 0"/>
        </svg>
      </button>
      <button class="action randomize-button hidden" id="randomize-button" type="button">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4m1.75 4.75a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 0 0 0-2.5m6.5 0a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 0 0 0-2.5m-6.5 6a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 0 0 0-2.5m3.25-3a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 0 0 0-2.5m3.25 3a1.25 1.25 0 1 0 0 2.5a1.25 1.25 0 0 0 0-2.5"/>
        </svg>
        <span id="randomize-label"></span>
      </button>
      <button class="nav" id="next-button" type="button" aria-label="Next step">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M9.3 17.7a1 1 0 0 1 0-1.4L13.59 12L9.3 7.7a1 1 0 0 1 1.41-1.4l5 5a1 1 0 0 1 0 1.4l-5 5a1 1 0 0 1-1.41 0"/>
        </svg>
      </button>
    </section>

    <aside class="side-legend hidden" id="side-legend" aria-live="polite">
      <div class="side-legend-title" id="legend-title"></div>
      <div class="side-legend-item" id="legend-item-curve"><span class="legend-line curve"></span><span id="legend-curve"></span></div>
      <div class="side-legend-item" id="legend-item-hex"><span class="legend-line hex"></span><span id="legend-hex"></span></div>
      <div class="side-legend-item" id="legend-item-guide"><span class="legend-line guide"></span><span id="legend-guide"></span></div>
      <div class="side-legend-item" id="legend-item-pascal"><span class="legend-line pascal"></span><span id="legend-pascal"></span></div>
    </aside>

    <section class="caption hidden" aria-live="polite">
      <div class="caption-box" id="caption-box">
        <span class="caption-step" id="caption-step"></span>
        <span class="caption-title" id="caption-title"></span>
        <span class="caption-text" id="caption-text"></span>
      </div>
    </section>

    <section class="outro" id="outro">
      <div class="outro-inner">
        <div class="outro-copy">
          <p class="eyebrow" id="outro-eyebrow"></p>
          <h2 class="outro-title" id="outro-title"></h2>
          <p class="outro-subtitle" id="outro-subtitle"></p>
          <ul class="sources" id="sources-list"></ul>
          <div class="outro-actions">
            <button class="action primary" id="restart-button" type="button">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 5a7 7 0 1 1-6.32 10H3.5a.5.5 0 0 1-.4-.8l2.82-3.76a.5.5 0 0 1 .8 0l2.82 3.76a.5.5 0 0 1-.4.8H7.82A5 5 0 1 0 12 7a4.96 4.96 0 0 0-2.73.81a1 1 0 1 1-1.09-1.68A6.96 6.96 0 0 1 12 5"/>
              </svg>
              <span id="restart-label"></span>
            </button>
            <button class="action" id="outro-home-button" type="button">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 4.2 4.5 10v9a1 1 0 0 0 1 1H10v-5h4v5h4.5a1 1 0 0 0 1-1v-9z"/>
              </svg>
              <span id="outro-home-label"></span>
            </button>
          </div>
        </div>
        <div class="outro-side"></div>
      </div>
    </section>
  </main>

  <script src="./scripts/main.js"></script>
</body>
</html>
